# Long-lived control panel:  docker compose up -d polygp
#
# The tunnel lives entirely in userspace (openconnect --script-tun + ocproxy),
# so unlike the usual VPN container this one needs no NET_ADMIN, no
# /dev/net/tun and no root. It publishes two ports: the SOCKS5 tunnel, and a
# noVNC page serving the browser you log in through.
services:
  polygp:
    build:
      context: .
      args:
        # Optional PyPI mirror for the build, e.g.
        #   PIP_INDEX_URL: https://mirrors.zju.edu.cn/pypi/web/simple
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
        # Image provenance labels; scripts/build.sh fills these from git so
        # the docker tag always matches the git tag. A plain
        # `docker compose build` labels the image dev/unknown.
        VERSION: ${POLYGP_VERSION:-dev}
        REVISION: ${POLYGP_REVISION:-unknown}
    image: polygp:latest
    container_name: polygp
    environment:
      PORTAL: ${PORTAL:-researchvpn.polyu.edu.hk}
      SAML_ENDPOINT: ${SAML_ENDPOINT:-gateway}   # gateway | portal
      SOCKS_PORT: ${SOCKS_PORT:-11937}
      VNC_PORT: ${VNC_PORT:-6080}
      CONTROL_PORT: ${CONTROL_PORT:-11936}
      # Xvfb/Chromium desktop size; the control panel fits noVNC to this ratio.
      VNC_SCREEN: ${VNC_SCREEN:-1600x900x24}
      # Require ?token=... on the control endpoints (do set this if
      # the port is reachable by anyone but you).
      CONTROL_TOKEN: ${CONTROL_TOKEN:-}
      # Keep the service idle at boot. A SAML request is generated only after
      # /login or after a code is submitted from the panel. Set AUTO_LOGIN=1
      # only if an immediate login attempt is intentional.
      AUTO_LOGIN: ${AUTO_LOGIN:-0}
      # Where the control panel's "reload" button re-reads settings from.
      POLYGP_ENV_FILE: /opt/polygp/.env
      # The generated HIP identity lives here, on the polygp-hip volume, so it
      # is minted once and kept across container recreation.
      POLYGP_HIP_CONF: /opt/polygp/hipdata/hipreport.conf
      # Set to reuse a fixed VNC password; otherwise one is generated per run
      # and printed in the banner.
      VNC_PASSWORD: ${VNC_PASSWORD:-}
      LOGIN_TIMEOUT: ${LOGIN_TIMEOUT:-600}
      # Keyboard escape hatch, e.g. -nomodtweak (see entrypoint.sh)
      X11VNC_ARGS: ${X11VNC_ARGS:-}
      # Optional: pre-fill the login form after one click in the Browser pane,
      # leaving only MFA to you.
      POLYGP_NETID: ${POLYGP_NETID:-}
      POLYGP_NETPASS: ${POLYGP_NETPASS:-}
      # auto | manual | off — auto waits for a Browser click before typing.
      POLYGP_FILL_MODE: ${POLYGP_FILL_MODE:-}
      # on | off — whether a session that dies (e.g. a failed HIP recheck
      # makes openconnect log out and exit) starts a fresh login by itself.
      POLYGP_AUTO_RELOGIN: ${POLYGP_AUTO_RELOGIN:-on}
      # Text of the service option to pick after the credential form,
      # matched against what is on screen (e.g. research).
      POLYGP_VPN_CHOICE: ${POLYGP_VPN_CHOICE:-}
    ports:
      # Bound to loopback by default. To reach the container from another
      # machine (e.g. over tailscale), set the BIND vars to that interface's
      # address, or to 0.0.0.0 if the network is trusted.
      - "${SOCKS_BIND:-127.0.0.1}:${SOCKS_PORT:-11937}:${SOCKS_PORT:-11937}"
      - "${VNC_BIND:-127.0.0.1}:${VNC_PORT:-6080}:${VNC_PORT:-6080}"
      - "${CONTROL_BIND:-127.0.0.1}:${CONTROL_PORT:-11936}:${CONTROL_PORT:-11936}"
    volumes:
      # Mounted so /reload can pick up edits without recreating the
      # container; compose itself only reads .env on the host at start-up.
      - ./.env:/opt/polygp/.env:ro
      # Holds the HIP identity generated on first boot, so it stays stable
      # across container recreation. A named volume (not a bind) so it inherits
      # the image dir's polygp ownership and the non-root user can write it.
      - polygp-hip:/opt/polygp/hipdata
    stdin_open: true
    tty: true

volumes:
  polygp-hip:
